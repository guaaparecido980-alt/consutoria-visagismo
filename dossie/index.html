<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dossiê de Visagismo · Wagner Alves</title>
<meta name="description" content="Sistema de análise e emissão do dossiê de consultoria de visagismo masculino de Wagner Alves.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17140f">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/dossie.css?v=3">
<link rel="stylesheet" href="assets/app.css?v=3">
</head>
<body>

<header class="topo">
  <div class="topo__marca">
    <b>WAGNER ALVES</b>
    <span>Dossiê de Visagismo</span>
  </div>
  <div class="acoes">
    <button class="btn" id="btn-novo" title="Apaga a ficha atual e começa em branco">Novo cliente</button>
    <button class="btn btn--ouro" id="btn-pdf">Gerar PDF</button>
  </div>
</header>

<main class="editor">

  <!-- coluna da esquerda: a ficha -->
  <div class="forma">
    <div class="forma__cabeca">
      <h2 id="nome-editor">Novo cliente</h2>
      <button class="btn btn--alternar" id="btn-alternar">Ver dossiê</button>
    </div>
    <div class="passos" id="passos" role="tablist"></div>
    <div id="secoes"></div>
  </div>

  <!-- coluna da direita: o dossiê -->
  <div class="visor">
    <div class="visor__barra">
      <span class="visor__conta" id="indice-pagina">Página 1</span>
      <span class="visor__conta visor__conta--leve" id="conta-paginas"></span>
      <button class="btn btn--pequeno" id="btn-anterior" aria-label="Página anterior">↑</button>
      <button class="btn btn--pequeno" id="btn-proxima" aria-label="Próxima página">↓</button>
    </div>
    <div class="visor__palco" id="palco"></div>
  </div>

</main>

<!-- Bibliotecas de exportação. Versões fixas, para o comportamento não mudar
     sozinho quando o CDN atualizar. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script src="assets/conteudo.js"></script>
<script src="assets/rostos/rostos3d.js"></script>
<script src="assets/diagramas.js"></script>
<script src="assets/slides.js?v=3"></script>
<script src="assets/rascunho.js"></script>
<script src="assets/app.js?v=3"></script>
</body>
</html>
